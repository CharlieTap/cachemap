name: Pull Request Comment
on:
  issue_comment:
    types: [created, edited, deleted]

jobs:
  derive-branch:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      branch: ${{ steps.set-output.outputs.branch }}
    steps:
      - id: set-output
        run: echo "branch=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq .head.ref)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  benchmark:
    needs: derive-branch
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/benchmark')
    permissions:
      contents: write
    with:
      runner: macos-latest
      branch: ${{ needs.derive-branch.outputs.branch }}
      should-commit-benchmark: true
    uses: ./.github/workflows/benchmark.yml
