name: CI for main

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

jobs:

  lint:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ubuntu-24.04-arm
      task: lintKotlin
    secrets: inherit

  metadata:
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ubuntu-24.04-arm
      task: compileCommonMainKotlinMetadata
    secrets: inherit

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            task: jvmTest
          - os: ubuntu-latest
            task: compileKotlinLinuxArm64
          - os: ubuntu-latest
            task: linuxX64Test
          - os: macos-latest
            task: macosArm64Test iosSimulatorArm64Test
          - os: macos-latest
            task: compileKotlinMacosX64 compileKotlinIosX64 compileKotlinIosArm64
          - os: windows-latest
            task: mingwX64Test
    uses: ./.github/workflows/task-runner.yml
    with:
      runner: ${{ matrix.os }}
      task: ${{ matrix.task }}
    secrets: inherit
