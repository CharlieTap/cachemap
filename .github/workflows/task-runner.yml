name: Gradle task workflow 🔨

on:
  workflow_call:
    inputs:
      runner:
        type: string
        description: 'The machine runner the workflow should run on'
        default: macos-latest
        required: true
      task:
        type: string
        description: 'The Gradle task or tasks to run'
        default: build
        required: true
    secrets:
      gradle_encryption_key:
        description: 'Encryption key for trusted Gradle configuration-cache entries'
        required: false

permissions:
  contents: read

jobs:
  task:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-strict-match: true
          cache-encryption-key: ${{ secrets.gradle_encryption_key }}

      - name: Execute Gradle task
        shell: bash
        env:
          GRADLE_TASKS: ${{ inputs.task }}
        run: |
          set -euo pipefail
          IFS=' ' read -r -a tasks <<< "$GRADLE_TASKS"
          if (( ${#tasks[@]} == 0 )); then
            echo "No Gradle tasks were supplied" >&2
            exit 1
          fi
          for task in "${tasks[@]}"; do
            if [[ ! "$task" =~ ^[A-Za-z0-9_:][A-Za-z0-9_.:-]*$ ]]; then
              echo "Invalid Gradle task: $task" >&2
              exit 1
            fi
          done
          ./gradlew "${tasks[@]}"
